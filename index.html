<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>West Tokyo Jewels - Premium Jewelry Store</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💎</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- iOS対応: body最優先。video は src 直接・width/height 明示・playsinline 必須。装飾扱いさせない。 -->
    <div class="video-background" id="videoBackground">
        <video id="bgVideo"
               src="/public/videos/video-output-89612E44-DF59-414E-B8F0-781525F2B34D.mp4"
               width="1920" height="1080"
               autoplay loop muted playsinline webkit-playsinline x5-playsinline
               preload="auto"
               disableRemotePlayback disablePictureInPicture>
        </video>
        <div class="video-overlay" aria-hidden="true"></div>
    </div>

    <!-- スプラッシュスクリーン -->
    <div class="splash-screen" id="splashScreen">
        <img src="/images/wtj%20logo.png" alt="WEST TOKYO JEWELS" class="splash-logo">
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <a href="/" class="logo-link" id="logoLink">
                <img src="/images/IMG_7300.png" alt="WEST TOKYO JEWELS" class="logo-img" id="logo">
            </a>
            <div class="cart-icon-container">
                <button class="cart-icon" id="cartIcon" aria-label="View cart">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <path d="M16 10a4 4 0 0 1-8 0"></path>
                    </svg>
                    <span class="cart-badge" id="cartBadge">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-content">
            <nav class="sidebar-nav">
                <button class="category-btn active" data-category="all">All</button>
                <button class="category-btn" data-category="earrings">Earrings</button>
                <button class="category-btn" data-category="necklace">Necklace</button>
                <button class="category-btn" data-category="bracelet">Bracelet</button>
            </nav>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
        <div class="content-wrapper">
            <!-- Hero Section -->
            <section class="hero-section" id="heroSection">
                <div class="hero-content">
                    <h1 class="hero-title">WEST TOKYO JEWELS</h1>
                    <p class="hero-subtitle">時を超える美しさ、永遠の輝き</p>
                    <p class="hero-description">卓越した職人技と最高級の素材が織りなす、唯一無二のジュエリーコレクション</p>
                </div>
            </section>

            <!-- Products Section -->
            <section class="products-section">
                <div class="products-container" id="productsContainer">
                    <!-- Products are dynamically generated by JavaScript -->
                    <div class="loading" id="loading">商品を読み込み中...</div>
                </div>
            </section>
        </div>
    </main>

    <!-- Cart Side Panel -->
    <div class="cart-panel" id="cartPanel">
        <div class="cart-panel-header">
            <h2>カート</h2>
            <button class="cart-close" id="cartClose" aria-label="Close cart">&times;</button>
        </div>
        <div class="cart-items" id="cartItems">
            <p class="cart-empty">カートは空です</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>合計:</span>
                <span id="cartTotal">¥0</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn" disabled>決済に進む</button>
        </div>
    </div>

    <!-- カートオーバーレイ -->
    <div class="cart-overlay" id="cartOverlay"></div>

    <!-- 商品詳細モーダル -->
    <div class="product-modal" id="productModal">
        <div class="product-modal-overlay" id="productModalOverlay"></div>
        <div class="product-modal-content">
            <button class="product-modal-close" id="productModalClose" aria-label="Close">&times;</button>
            <div class="product-detail-container">
                <div class="product-detail-image-section">
                    <div class="product-detail-image-main">
                        <img id="productDetailImage" src="" alt="" class="product-detail-image">
                        <button class="product-image-nav product-image-prev" id="productImagePrev" aria-label="前の画像">‹</button>
                        <button class="product-image-nav product-image-next" id="productImageNext" aria-label="次の画像">›</button>
                    </div>
                    <div class="product-detail-image-thumbnails" id="productImageThumbnails">
                        <!-- サムネイル画像はJavaScriptで動的に生成 -->
                    </div>
                </div>
                <div class="product-detail-info">
                    <h2 id="productDetailName" class="product-detail-name"></h2>
                    <p id="productDetailDescription" class="product-detail-description"></p>
                    <div id="productDetailDetailedDescription" class="product-detail-detailed-description"></div>
                    <div class="product-detail-size-section" id="productDetailSizeSection">
                        <label class="product-detail-size-label">サイズ</label>
                        <div class="product-detail-sizes" id="productDetailSizes">
                            <!-- サイズ選択はJavaScriptで動的に生成 -->
                        </div>
                    </div>
                    <div class="product-detail-price-wrapper">
                        <span id="productDetailPrice" class="product-detail-price"></span>
                        <span class="product-detail-stock" id="productDetailStock"></span>
                    </div>
                    <div class="product-detail-actions">
                        <button class="product-detail-add-cart" id="productDetailAddCart">
                            <span>カートに追加</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
