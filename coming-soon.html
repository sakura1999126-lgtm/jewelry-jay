    <!-- 背景動画 -->
    <div class="video-background" id="videoBackground">

               preload="auto"
               disableRemotePlayback disablePictureInPicture>
        </video>

    </div>

    <!-- Coming Soon コンテンツ -->
    <div class="coming-soon-container">
        <div class="coming-soon-content">
            <img src="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/wtj%20logo.png" alt="WEST TOKYO JEWELS" class="coming-soon-logo">

        </div>
    </div>

    <script>
        // 背景動画の初期化（index.htmlと同じロジック）
        function initBackgroundVideo() {
            const video = document.getElementById('bgVideo');
            if (!video) return;

            video.addEventListener('loadeddata', () => {
                video.play().catch(err => {
                    console.log('Video autoplay failed:', err);
                });
            });

            video.addEventListener('error', () => {
                const videoBackground = document.getElementById('videoBackground');
                if (videoBackground) {
                    videoBackground.classList.add('video-fallback-active');
                }
            });
        }

        // iOS対応: ユーザーインタラクション後に動画を再生
        (function setupIosVideoPlayOnInteraction() {
            var isIOS =
                /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            if (!isIOS) return;

            var vid = document.getElementById('bgVideo');
            if (!vid) return;

            function tryPlayOnce() {
                if (!vid.paused) return;
                vid.play().catch(function () {});
            }

            document.addEventListener('touchstart', tryPlayOnce, { once: true });
            window.addEventListener('scroll', tryPlayOnce, { once: true });
            document.addEventListener('click', tryPlayOnce, { once: true });
        })();

        // ページロード時に動画を初期化
        document.addEventListener('DOMContentLoaded', () => {
            initBackgroundVideo();
        });
    </script>
