<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - West Tokyo Jewels</title>
    <!-- Favicon設定 - 検索結果アイコン用 -->
    <link rel="icon" type="image/png" sizes="32x32" href="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/IMG_7300.png">
    <link rel="icon" type="image/png" sizes="16x16" href="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/IMG_7300.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/IMG_7300.png">
    <link rel="shortcut icon" href="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/IMG_7300.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500&family=Shippori+Mincho:wght@400;500&family=Noto+Serif+JP:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="checkout-container">
        <header class="checkout-header">
            <a href="/" class="checkout-logo-link">
                <img src="https://pub-23a88b535b73423c909a3b841e3fde53.r2.dev/images/IMG_7300.png" alt="WEST TOKYO JEWELS" class="checkout-logo-img">
            </a>
            <a href="/" class="back-link">← ホームに戻る</a>
        </header>

        <main class="checkout-main">
            <div class="checkout-content">
                <!-- Unified Order & Payment Card -->
                <section class="checkout-cart-section" style="gap: 1.5rem;">
                    <div>
                        <h2 style="margin-bottom: 0.75rem;">ご注文内容とお支払い</h2>
                        <div id="outOfStockWarning" style="display: none; background: rgba(255, 215, 0, 0.1); border: 1px solid rgba(255, 215, 0, 0.3); border-radius: 8px; padding: 0.75rem; margin-bottom: 1rem;">
                            <p style="color: rgba(255, 215, 0, 0.9); margin: 0; font-size: 0.85rem; line-height: 1.4;">
                                ⚠️ 売り切れ商品あり（発送まで2-3週間）
                            </p>
                        </div>
                    </div>

                    <div class="checkout-items" id="checkoutItems">
                        <!-- Cart items are dynamically generated by JavaScript -->
                    </div>

                    <div class="checkout-summary" style="border-top: 1px solid rgba(255,255,255,0.08); padding-top: 1rem;">
                        <div class="summary-row">
                            <span>小計</span>
                            <span id="checkoutSubtotal">¥0</span>
                        </div>
                        <div class="summary-row">
                            <span>送料</span>
                            <span id="checkoutShipping">¥0</span>
                        </div>
                        <div class="summary-row total">
                            <span>お支払い合計</span>
                            <span id="checkoutTotal">¥0</span>
                        </div>
                        <button type="button" class="checkout-submit-btn" id="stripeCheckoutBtn" style="width: 100%; margin-top: 1rem;">
                            Stripeで支払いへ進む
                        </button>
                    </div>
                </section>
                <footer class="site-footer">
                    <nav class="site-footer-links" aria-label="法的情報">
                        <a href="terms.html">利用規約</a>
                        <a href="privacy.html">プライバシーポリシー</a>
                        <a href="tokusho.html">特定商取引法に基づく表記</a>
                    </nav>
                    <p class="site-footer-copy">&copy; West Tokyo Jewels</p>
                </footer>
            </div>
        </main>
    </div>

    <script src="https://js.stripe.com/v3"></script>
    <script src="script.js"></script>
    <script>
        // Checkout page specific script
        document.addEventListener('DOMContentLoaded', async () => {
            // Get cart data from local storage
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            
            if (cart.length === 0) {
                window.location.href = '/';
                return;
            }

            // Display cart items
            const checkoutItems = document.getElementById('checkoutItems');
            let subtotal = 0;

            // 商品データを取得して画像情報を補完
            fetch('/api/products')
                .then(res => {
                    if (!res.ok) {
                        throw new Error(`HTTP error! status: ${res.status}`);
                    }
                    return res.json();
                })
                .then(products => {
                    // レスポンスが配列でない場合の処理（より堅牢に）
                    let productList = [];
                    if (Array.isArray(products)) {
                        productList = products;
                    } else if (products && Array.isArray(products.products)) {
                        productList = products.products;
                    } else if (products && typeof products === 'object') {
                        // 万一オブジェクトだった場合は値を配列化（id付き前提）
                        productList = Object.values(products);
                    } else {
                        console.warn('商品データ形式が不明です。空配列で処理します。', products);
                    }

                    if (!Array.isArray(productList)) {
                        console.warn('商品データが配列化できませんでした。空配列で処理します。', productList);
                        productList = [];
                    }

                    // 売り切れ商品があるかチェック
                    let hasOutOfStockItems = false;

                    cart.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        subtotal += itemTotal;

                        // 商品データから画像を取得
                        const product = productList.find(p => p.id === item.id);
                        let imageUrl = item.image || (product && product.image) || '';
                        
                        // 売り切れ商品をチェック
                        let isSoldOut = false;
                        if (product) {
                            // サイズがある場合は選択されたサイズの在庫を確認
                            if (item.size_name && product.sizes && product.sizes.length > 0) {
                                const selectedSize = product.sizes.find(s => s.name === item.size_name);
                                if (selectedSize) {
                                    isSoldOut = (selectedSize.stock || 0) <= 0;
                                } else {
                                    // サイズが見つからない場合は全体の在庫を確認
                                    isSoldOut = (product.stock || 0) <= 0;
                                }
                            } else {
                                isSoldOut = (product.stock || 0) <= 0;
                            }
                            
                            if (isSoldOut) {
                                hasOutOfStockItems = true;
                            }
                        }
                        
                        // プレースホルダーを除外
                        if (imageUrl.includes('placeholder.com')) {
                            imageUrl = '';
                        }

                        const itemElement = document.createElement('div');
                        itemElement.className = `checkout-item ${isSoldOut ? 'checkout-item-soldout' : ''}`;
                        
                        const imageHtml = imageUrl && !imageUrl.includes('placeholder.com')
                            ? `<img src="${imageUrl}" alt="${item.name}" onerror="this.style.display='none';">`
                            : '<div style="width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem;">📦</div>';
                        
                        const soldOutBadge = isSoldOut ? '<span class="checkout-item-soldout-badge">売り切れ</span>' : '';
                        const sizeDisplay = item.size_name ? (typeof getDisplaySizeName === 'function' ? getDisplaySizeName(item.size_name) : item.size_name) : '';
                        
                        itemElement.innerHTML = `
                            <div class="checkout-item-image">
                                ${imageHtml}
                                ${soldOutBadge}
                            </div>
                            <div class="checkout-item-details">
                                <h3>${item.name}</h3>
                                ${sizeDisplay ? `<p style="font-size: 0.75rem; color: rgba(255,215,0,0.8); margin-bottom: 0.25rem;">${sizeDisplay}</p>` : ''}
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                                    <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7);">数量: ${item.quantity}</span>
                                    <p class="checkout-item-price" style="margin: 0;">¥${itemTotal.toLocaleString()}</p>
                                </div>
                            </div>
                        `;
                        checkoutItems.appendChild(itemElement);
                    });

                    // 売り切れ警告を表示
                    const outOfStockWarning = document.getElementById('outOfStockWarning');
                    if (outOfStockWarning) {
                        outOfStockWarning.style.display = hasOutOfStockItems ? 'block' : 'none';
                    }

                    // Calculate and display total
                    const shipping = 0;
                    const total = subtotal + shipping;

                    document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
                    document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
                    document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;
                })
                .catch(error => {
                    console.error('商品データの取得に失敗しました:', error);
                    // エラーの場合は画像なしで表示
                    cart.forEach(item => {
                        const itemTotal = item.price * item.quantity;
                        subtotal += itemTotal;

                        const itemElement = document.createElement('div');
                        itemElement.className = 'checkout-item';
                        itemElement.innerHTML = `
                            <div class="checkout-item-image">
                                <div style="width: 100px; height: 100px; background: rgba(255,255,255,0.1); border-radius: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem;">📦</div>
                            </div>
                            <div class="checkout-item-details">
                                <h3>${item.name}</h3>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 0.5rem;">
                                    <span style="font-size: 0.85rem; color: rgba(255,255,255,0.7);">数量: ${item.quantity}</span>
                                    <p class="checkout-item-price" style="margin: 0;">¥${itemTotal.toLocaleString()}</p>
                                </div>
                            </div>
                        `;
                        checkoutItems.appendChild(itemElement);
                    });

                    // エラー時は売り切れ警告を非表示
                    const outOfStockWarning = document.getElementById('outOfStockWarning');
                    if (outOfStockWarning) {
                        outOfStockWarning.style.display = 'none';
                    }

                    const shipping = 0;
                    const total = subtotal + shipping;

                    document.getElementById('checkoutSubtotal').textContent = `¥${subtotal.toLocaleString()}`;
                    document.getElementById('checkoutShipping').textContent = `¥${shipping.toLocaleString()}`;
                    document.getElementById('checkoutTotal').textContent = `¥${total.toLocaleString()}`;
                });

            // Stripe公開キーを設定（提供されたキー）
            const STRIPE_PUBLISHABLE_KEY = 'pk_live_51RdmGtDF8kU2wSzlxNevjp7kXNAcK4XkuYvcZ22mWeLsXWQuQLazPw30qodEJ3DdodLul06q3HhjPcmRQHRvuXsO00aTo5x6HF';
            const stripe = window.Stripe ? Stripe(STRIPE_PUBLISHABLE_KEY) : null;

            // 合計金額の計算と表示はfetchのコールバック内で実行

            // Stripe Checkout処理
            const stripeCheckoutBtn = document.getElementById('stripeCheckoutBtn');
            
            stripeCheckoutBtn.addEventListener('click', async () => {
                // ボタンを無効化
                stripeCheckoutBtn.disabled = true;
                stripeCheckoutBtn.textContent = '処理中...';
                
                try {
                    if (!stripe) {
                        throw new Error('Stripe.jsの読み込みに失敗しました。ネットワーク状態をご確認ください。');
                    }

                    // カートデータをStripe Checkout用の形式に変換
                    const lineItems = cart.map(item => {
                        const hasImage = item.image && !item.image.includes('placeholder.com');
                        const productData = {
                            name: item.name,
                        };
                        // description は空文字を送らない
                        if (item.size_name) {
                            const displaySize = typeof getDisplaySizeName === 'function' ? getDisplaySizeName(item.size_name) : item.size_name;
                            if (displaySize) productData.description = `サイズ: ${displaySize}`;
                        }
                        if (hasImage) {
                            productData.images = [item.image];
                        }

                        return {
                            price_data: {
                                currency: 'jpy',
                                product_data: productData,
                                unit_amount: item.price
                            },
                            quantity: item.quantity
                        };
                    });
                    
                    // カートアイテムのメタデータ（在庫管理用）
                    const cartMetadata = cart.map(item => ({
                        productId: item.id,
                        sizeName: item.size_name || null,
                        quantity: item.quantity
                    }));
                    
                    // Stripe Checkout Sessionを作成するAPIを呼び出し
                    const response = await fetch('/api/checkout', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            lineItems: lineItems,
                            cartItems: cartMetadata,
                            successUrl: `${window.location.origin}/checkout-success.html?session_id={CHECKOUT_SESSION_ID}`,
                            cancelUrl: `${window.location.origin}/checkout.html`
                        })
                    });
                    
                    if (!response.ok) {
                        let errorData;
                        try {
                            errorData = await response.json();
                        } catch (e) {
                            errorData = { error: `HTTP error! status: ${response.status}` };
                        }
                        const errorMsg = errorData.error || errorData.message || `Server error: ${response.status}`;
                        console.error('API Error Response:', errorData);
                        throw new Error(errorMsg);
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        console.error('Stripe API Error:', data);
                        throw new Error(data.error);
                    }

                    // Stripe Checkout SessionのURLまたはsessionIdが返ってくる
                    if (data.url) {
                        // session.url が直接返ってきた場合
                        window.location.href = data.url;
                        return;
                    }

                    if (data.sessionId) {
                        // sessionId が返ってきた場合、Stripe.jsでリダイレクト
                        const { error: stripeError } = await stripe.redirectToCheckout({ sessionId: data.sessionId });
                        if (stripeError) {
                            throw new Error(stripeError.message);
                        }
                        return;
                    }
                    
                    // 予期しないレスポンス形式
                    console.error('予期しないStripe Checkoutレスポンス:', data);
                    throw new Error('Stripe Checkout Sessionの作成に失敗しました。サーバーのログを確認してください。');
                    
                } catch (error) {
                    console.error('Stripe Checkoutエラー:', error);
                    alert(`決済処理の開始中にエラーが発生しました: ${error.message}`);
                    stripeCheckoutBtn.disabled = false;
                    stripeCheckoutBtn.textContent = 'Stripe Checkoutに進む';
                }
            });
        });
    </script>
</body>
</html>
